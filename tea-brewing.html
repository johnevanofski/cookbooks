<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewing Tea</title>
<meta name="theme-color" content="#b7c9a0">
<link rel="icon" type="image/png" sizes="192x192" href="icons/tea-brewing-192.png">
<link rel="apple-touch-icon" href="icons/tea-brewing-180.png">
<link rel="manifest" href="tea-brewing.webmanifest">
<style>
  :root { --bg:#faf6f1; --card:#fff; --ink:#2b1d14; --muted:#7a6a5d; --accent:#8a4b22; --line:#e8ddd1; --tint:#f5ebe0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1511; --card:#2a2019; --ink:#f3e9df; --muted:#b5a496; --accent:#e0a068; --line:#3f3128; --tint:#352a21; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
         font:17px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.6rem; margin:4px 0 2px; }
  h2 { font-size:1.1rem; margin:0 0 10px; color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 12px; font-size:.95rem; }
  .search { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 8px; }
  .search input { width:100%; padding:12px 14px; font:inherit; border:1px solid var(--line); border-radius:12px;
                  background:var(--card); color:var(--ink); }
  .seg { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .seg .lbl { font-size:.85rem; color:var(--muted); width:4.6em; flex:none; }
  .seg button { flex:1; padding:9px 0; border:1px solid var(--line); border-radius:10px; background:var(--card);
                color:var(--ink); font:inherit; font-weight:600; }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .name { font-size:1.15rem; font-weight:700; }
  .desc { color:var(--muted); font-size:.88rem; margin:2px 0 10px; }
  .grid, .amts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
  .amts { grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); margin-top:8px; }
  .grid div, .amts div { background:var(--tint); border-radius:10px; padding:8px 4px; }
  .grid b { display:block; font-size:1.05rem; color:var(--accent); line-height:1.2; }
  .grid small { display:block; font-size:.75rem; color:var(--muted); }
  .amts b { display:block; font-size:1.25rem; color:var(--accent); line-height:1.2; }
  .amts small { display:block; font-size:.8rem; color:var(--muted); }
  .grid span, .amts span { font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .tip { color:var(--muted); font-size:.85rem; margin:8px 0 0; }
  .empty { text-align:center; color:var(--muted); padding:20px 0; display:none; }
  ol { margin:0; padding-left:1.2em; }
  li { margin-bottom:6px; }
  .note { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>

<h1>🫖 Brewing Tea</h1>
<p class="sub">1 cup = 8 oz (240 mL) of finished tea. Water in cups, with milliliters in parentheses.</p>

<div class="search">
  <input id="q" type="search" placeholder="Search tea (green, earl grey, chamomile, oolong…)" autocomplete="off">
  <div class="seg" id="mode">
    <span class="lbl">Style</span>
    <button data-m="hot" class="on">Hot</button><button data-m="iced">Iced</button><button data-m="cold">Cold brew</button>
  </div>
  <div class="seg" id="amt">
    <span class="lbl">Cups</span>
    <button data-c="1" class="on">1</button><button data-c="2">2</button><button data-c="3">3</button><button data-c="4">4</button>
  </div>
</div>

<div class="card" id="method"></div>

<div id="list"></div>
<p class="empty" id="empty">No tea found.</p>

<script>
  // g = grams of loose tea per 8 oz cup of hot tea; tsp = the same in teaspoons (varies with leaf size, so treat as approximate)
  const TEA = [
    { n:'Black (English Breakfast)', a:'english breakfast assam ceylon darjeeling sweet tea', d:'Bold, malty, full body. Takes milk and sweetener well.',
      g:2.5, tsp:1, f:'205–212°F', c:'96–100°C', hot:'3–5 min', cold:'8–12 hr',
      tip:'Over 5 minutes turns bitter. For classic sweet tea, stir sugar into the hot concentrate before adding ice.' },
    { n:'Earl Grey', a:'black bergamot citrus', d:'Black tea scented with bergamot orange.',
      g:2.5, tsp:1, f:'205–212°F', c:'96–100°C', hot:'3–5 min', cold:'8–12 hr',
      tip:'Lovely iced with a slice of lemon.' },
    { n:'Chai (spiced black)', a:'masala indian spiced', d:'Black tea with cinnamon, cardamom, ginger and clove.',
      g:3, tsp:1, f:'212°F', c:'100°C', hot:'4–5 min', cold:'8–12 hr',
      tip:'For hot chai, simmer half milk and half water, then strain.' },
    { n:'Green', a:'sencha dragonwell gunpowder', d:'Fresh, grassy and light.',
      g:2, tsp:1, f:'160–180°F', c:'70–82°C', hot:'2–3 min', cold:'6–8 hr',
      tip:'Water that is too hot or steeping too long makes it bitter. Let boiled water rest a few minutes first.' },
    { n:'Jasmine (green)', a:'jasmine pearls scented green', d:'Green tea scented with jasmine blossoms. Floral.',
      g:2, tsp:1, f:'170–180°F', c:'77–82°C', hot:'2–3 min', cold:'6–8 hr',
      tip:'Pearls unfurl as they steep, so a roomy infuser helps.' },
    { n:'White', a:'silver needle white peony bai mu dan', d:'Delicate, sweet and soft. The least processed.',
      g:2.5, tsp:2, f:'175–185°F', c:'80–85°C', hot:'3–5 min', cold:'8–12 hr',
      tip:'The leaves are fluffy and light, so measure by weight if you can.' },
    { n:'Oolong', a:'tieguanyin wuyi', d:'Between green and black. Floral to roasted depending on the type.',
      g:3, tsp:1, f:'185–205°F', c:'85–96°C', hot:'3–5 min', cold:'8–12 hr',
      tip:'Good tea can be steeped 2–3 times; add 30–60 seconds each time.' },
    { n:'Pu-erh', a:'puer fermented dark', d:'Aged, fermented tea. Earthy and smooth.',
      g:3, tsp:1, f:'205–212°F', c:'96–100°C', hot:'3–5 min', cold:'8–12 hr',
      tip:'Many people rinse the leaves with hot water for a few seconds first, then discard the rinse.' },
    { n:'Rooibos', a:'red tea south african herbal caffeine free', d:'Caffeine-free red bush. Naturally sweet and nutty.',
      g:2.5, tsp:1, f:'212°F', c:'100°C', hot:'5–7 min', cold:'8–12 hr',
      tip:'Hard to over-steep, so it is forgiving.' },
    { n:'Chamomile', a:'herbal caffeine free tisane', d:'Caffeine-free dried flowers. Soft, apple-like.',
      g:2, tsp:2, f:'212°F', c:'100°C', hot:'5 min', cold:'8–12 hr',
      tip:'Cover the cup while steeping to keep the aroma in.' },
    { n:'Peppermint', a:'mint herbal caffeine free tisane', d:'Caffeine-free and cooling.',
      g:2, tsp:2, f:'212°F', c:'100°C', hot:'5–7 min', cold:'6–8 hr',
      tip:'Fresh leaves also work: use a small handful per cup.' },
    { n:'Hibiscus', a:'herbal caffeine free tisane red tart', d:'Caffeine-free, deep red and tart like cranberry.',
      g:2, tsp:1, f:'212°F', c:'100°C', hot:'5–7 min', cold:'6–8 hr',
      tip:'Very tart, so it usually wants sweetener. Stains easily.' }
  ];

  // Per finished cup: hot = full amount; iced = brewed strong in half the water then poured over ice; cold brew = a bit more tea, cold water
  const MODES = {
    hot:  { mult:1,   waterPerCup:240 },
    iced: { mult:1.5, waterPerCup:120 },   // + 120 g ice per cup
    cold: { mult:1.5, waterPerCup:240 }
  };
  const METHOD = {
    hot: ['Hot tea', [
      'Heat fresh water to the temperature listed on the card.',
      'Warm the pot or mug with a splash of hot water.',
      'Add the tea (in an infuser, or loose in a pot to strain later).',
      'Pour the water over the tea and cover. Steep for the time listed.',
      'Remove the leaves so the tea does not turn bitter.']],
    iced: ['Iced tea (hot-brewed over ice)', [
      'Brew a strong concentrate: use the tea and hot water amounts shown, at the temperature and time on the card.',
      'Strain out the leaves. Stir in sugar now, while it is hot, if you want it sweet.',
      'Pour over the ice amount shown and stir until chilled.',
      'Top up with cold water to taste if it is too strong.',
      'Keeps in the fridge for about 3 days.']],
    cold: ['Cold brew iced tea', [
      'Put the tea in a jar or pitcher and add the cold water shown.',
      'Cover and refrigerate for the time on the card.',
      'Strain out the leaves and serve over ice.',
      'Smooth and less bitter than hot-brewed. Keeps in the fridge for about 3 days.']]
  };

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const q = document.getElementById('q');
  let mode = 'hot', amount = 1;

  const FR = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞'];
  // cups rounded to the nearest 1/8 (2 tbsp), as a mixed fraction
  function cups(n) {
    const e = Math.round(n * 8), whole = Math.floor(e / 8), f = FR[e % 8];
    return (whole || !f ? whole : '') + f + (e > 8 ? ' cups' : ' cup');
  }
  const half = n => Math.round(n * 2) / 2;               // nearest 0.5 g
  function tsps(n) {                                     // nearest 1/4 tsp
    const e = Math.round(n * 4), whole = Math.floor(e / 4), f = ['', '¼', '½', '¾'][e % 4];
    return (whole || !f ? whole : '') + f;
  }

  function card(x) {
    const m = MODES[mode];
    const tea = x.g * m.mult * amount, tsp = x.tsp * m.mult * amount;
    const waterMl = m.waterPerCup * amount;
    const waterLbl = mode === 'iced' ? 'Hot water' : mode === 'cold' ? 'Cold water' : 'Water';
    const info = mode === 'cold'
      ? `<div><b>Cold</b><small>filtered water</small><span>Water</span></div>
         <div><b>${x.cold}</b><small>in the fridge</small><span>Steep</span></div>`
      : `<div><b>${x.f}</b><small>${x.c}</small><span>Water temp</span></div>
         <div><b>${x.hot}</b><small>&nbsp;</small><span>Steep</span></div>`;
    return `<div class="card" data-s="${(x.n + ' ' + x.a).toLowerCase()}">
      <div class="name">${x.n}</div>
      <div class="desc">${x.d}</div>
      <div class="grid">
        ${info}
        <div><b>${half(x.g * m.mult)} g</b><small>≈ ${tsps(x.tsp * m.mult)} tsp</small><span>Tea / cup</span></div>
      </div>
      <div class="amts">
        <div><b>${half(tea)} g</b><small>≈ ${tsps(tsp)} tsp</small><span>Tea for ${amount}</span></div>
        <div><b>${cups(waterMl / 240)}</b><small>(${waterMl} mL)</small><span>${waterLbl}</span></div>
        ${mode === 'iced' ? `<div><b>${120 * amount} g</b><small>of ice</small><span>Ice</span></div>` : ''}
      </div>
      <p class="tip">${x.tip}</p>
    </div>`;
  }

  function applyFilter() {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    list.querySelectorAll('.card').forEach(c => {
      const ok = terms.every(t => c.dataset.s.includes(t));
      c.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  }

  function render() {
    const [title, steps] = METHOD[mode];
    document.getElementById('method').innerHTML =
      `<h2>${title}</h2><ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>
       <p class="note" style="margin:10px 0 0">Amounts are per finished cup (8 oz). A standard tea bag is about 2 g, so use 1 bag per hot cup, or 1½ bags per iced or cold-brew cup. These are starting points; adjust to taste.</p>`;
    list.innerHTML = TEA.map(card).join('');
    applyFilter();
  }

  q.addEventListener('input', applyFilter);
  function wire(id, fn) {
    document.querySelectorAll('#' + id + ' button').forEach(b => b.onclick = () => {
      document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      fn(b);
      render();
    });
  }
  wire('mode', b => mode = b.dataset.m);
  wire('amt', b => amount = +b.dataset.c);

  render();
</script>
</body>
</html>
